[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-product-prediction"
version = "0.1.0"
description = "ML-based supply chain prediction system with Flask + LLM integration"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "flask",
    "openai",
    "python-dotenv"
]

[tool.setuptools]
packages = ["server"]
